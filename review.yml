- date: '2026-09-01'
  rating: 6
  summary: 'Re-profiled under the university pipeline, which settles WHO OPERATES each surface before
    saving any contract. The June 2026 review concluded the university''s footprint was limited to a documented-but-unreachable
    Pure OAI-PMH endpoint. That was wrong in both directions. The OAI-PMH claim does not survive re-probing
    — every base-URL variant errors and the library page cited for it no longer mentions OAI-PMH — and
    has been retired. But the university does operate a real API of its own that the earlier pass missed
    entirely: the University of Twente Energy API at energyapi.utwente.nl, publishing an OpenAPI 3.0.1
    contract and a Swagger UI, requiring no authentication, and serving historical electricity, gas, heat,
    water and solar metering for 103 named campus resources with a CO2-equivalent mode. It was found from
    the university''s own open-data page and confirmed by the energydata.utwente.nl JavaScript bundle,
    which names the API host and its path template. Live calls returned real kWh and kg CO2e series. Two
    contract defects were measured: the spec declares RFC 7807 ProblemDetails on 400 but the service returns
    a bespoke envelope, and GET /api/Dashboard is documented as 200 but returned 400. Three further institution-or-federation
    surfaces were confirmed — a SAML 2.0 IdP on a Microsoft Entra tenant registered in SURFconext with
    Shibboleth scope utwente.nl, a Crossref membership held by the University Library under prefix 10.3990,
    and a machine-readable llms.txt at the web root (which is not valid JSON and whose bachelor and master
    arrays are elided). Five surfaces were recorded as tenant relationships and NOT credited as the university''s
    engineering: Elsevier Pure (research.utwente.nl and ris.utwente.nl both CNAME to utwente-pva.elsevierpure.com),
    Instructure Canvas (canvas.utwente.nl CNAMEs to utwente-vanity.instructure.com, LTI 1.3 JWKS public),
    CACI OSIRIS (utwente.osiris-student.nl), 4TU.ResearchData (named groups 28592 and 28634), and an SOP
    Mobility-Online Erasmus Without Paper node declaring 15 UT-scoped mobility APIs. No DataCite membership
    was claimed: the university has no DataCite client of its own and its data DOIs are minted under 4TU''s
    10.4121 prefix. No endpoints were fabricated; no vendor contract was saved.'
  endpoints:
  - url: https://energyapi.utwente.nl/swagger/v1/swagger.json
    status: 200
    note: University of Twente Energy API — OpenAPI 3.0.1, 3 paths, 9 schemas, 9,647 bytes. The institution's
