  - aid: university-of-twente:4tu-researchdata
    name: University of Twente collections in 4TU.ResearchData
    x-operator: tenant
    description: >-
      4TU.ResearchData is the research-data repository the University of Twente co-founded, hosted
      and governed by TU Delft on the open-source djehuty platform at data.4tu.nl. The university
      holds two named scopes in it, evidenced from the repository's own group listing at
      /v3/groups: group 28592 "University of Twente" (association utwente.nl) and group 28634
      "University of Twente Students" (association student.utwente.nl), both flagged featured, and
      a public institution landing page. The datasets and their 10.4121 DOIs are the university's;
      the repository and its API are 4TU's, so no 4TU or Figshare contract is saved under this
      slug. Note for anyone re-probing: the public API's group filter does not scope results —
      /v3/datasets?group=28592 returns records from other groups — so dataset counts per
      institution cannot be taken from that endpoint.
    humanURL: https://data.4tu.nl/institutions/University_of_Twente
    tags: [ Research Data, Repository, 4TU, Datasets, Open Science, DOI ]
