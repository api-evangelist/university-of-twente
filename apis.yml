    name: University of Twente Canvas LMS Tenant
    x-operator: tenant
    description: >-
      The university's learning management system, canvas.utwente.nl, a CNAME to
      utwente-vanity.instructure.com. Its LTI 1.3 platform JWKS at /api/lti/security/jwks is
