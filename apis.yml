  - aid: university-of-twente:pure-research-information
    name: UT Research Information (Elsevier Pure)
    x-operator: tenant
    description: >-
      The university's research information system and publication repository, at
      research.utwente.nl with the back-office at ris.utwente.nl and persistent-URL resolvers at
