  - aid: university-of-twente:ewp-mobility-node
    name: University of Twente Erasmus Without Paper Node
    x-operator: tenant
    description: >-
      A live Erasmus Without Paper discovery manifest served on a University of Twente hostname,
      declaring fifteen EWP APIs with every endpoint URL scoped to the HEI ID utwente.nl —
      institutions, organizational-units, iias, iia-cnr, iias-approval, iia-approval-cnr,
      omobilities, omobility-stats, omobility-cnr, omobility-las, omobility-la-cnr, imobilities,
      imobility-cnr, factsheet and discovery itself. EWP is the European Commission-backed
      machine-to-machine network for Erasmus+ student mobility. By operation count this is the
      university's largest declared API surface. It is recorded as tenant rather than institution
      because the platform is SOP's Mobility-Online (the manifest's admin contact is
      ewp@sop.co.at, the host resolves to 77.237.55.133 outside UT address space) and the API
      contracts are the EWP consortium's shared specifications — the deployment and the data are
      the university's, the engineering is not.
    humanURL: https://mobility-online.utwente.nl/mobility/ewp/manifest?api=all
    baseURL: https://mobility-online.utwente.nl/mobility/ewp/
    tags: [ Student Mobility, Erasmus, EWP, Interoperability, Europe ]
    properties:
      - type: Manifest
        url: https://mobility-online.utwente.nl/mobility/ewp/manifest?api=all
      - type: Specification
