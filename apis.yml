apis:
  - aid: university-of-twente:energy-api
    name: University of Twente Energy API
    x-operator: institution
    description: >-
      The university's own API, and the only contract in this profile it wrote. A public,
      unauthenticated REST service on the university's own network (energyapi.utwente.nl,
      130.89.3.170, ASP.NET Core / Kestrel) returning historical metered energy for 103 campus
      resources — individual buildings such as bastille and boortoren plus the campus-wide
      universiteit-twente roll-up — across electricity, gas, heat, water and solar, at hour, day,
      week, month or year resolution, back to at least 2019. Setting co2=true returns the series
      in kg CO2e against the Dutch national energy-mix emission factor. An OpenAPI 3.0.1 document
      and a Swagger UI are published at the host. Two contract defects were measured and are
      recorded in errors/: the spec declares RFC 7807 ProblemDetails on 400 but the service
      returns a bespoke {error, results} envelope, and GET /api/Dashboard is documented as 200 but
      returned 400 when probed. info.contact names Realised, the contracted developer, rather than
      the university.
    humanURL: https://energydata.utwente.nl/
    baseURL: https://energyapi.utwente.nl
    tags: [ Energy, Open Data, Sustainability, Campus, Metering, Carbon ]
