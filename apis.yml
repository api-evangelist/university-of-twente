x-coverage:
  state: covered
  reason: covered
  detail: >-
    The institution operates one public API of its own and it was found, harvested, probed live
    and fully documented. The University of Twente Energy API at energyapi.utwente.nl publishes an
    OpenAPI 3.0.1 contract and a Swagger UI, needs no credential, and returned real metered data
    on 2026-09-01. Around it, three further institution-or-federation surfaces were confirmed: a
    SAML 2.0 IdP registered in SURFconext with Shibboleth scope utwente.nl, a Crossref membership
    in the library's own name under prefix 10.3990, and a machine-readable llms.txt at the web
    root. Five tenant relationships were recorded rather than credited as the university's
    engineering — Elsevier Pure, Instructure Canvas, CACI OSIRIS, 4TU.ResearchData and an SOP
    Mobility-Online EWP node. What is genuinely absent is a central developer portal, an API
    catalog, published terms or rate limits for the one API that exists, and any public course,
    timetable, transit, dining or room-booking API; the authoritative course data sits behind
    OSIRIS login. One prior claim was retired: the Pure OAI-PMH endpoint this repo carried since
    2026-06-03 does not respond and is no longer documented by the page that was cited for it.
