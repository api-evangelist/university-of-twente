      ris.utwente.nl both CNAME to utwente-pva.elsevierpure.com via eu.prod.elsevierpure.com. The
      research output, the profiles and the projects are the university's; the contract is
      Elsevier's, so no Pure specification is saved under this slug. CORRECTION, 2026-09-01: this
      repo previously carried this surface as a documented OAI-PMH harvesting endpoint. Every OAI
      base-URL variant was re-probed and none responds — /ws/oai?verb=Identify returns 500,
      /ws/oai/?verb=Identify returns 404, /oai?verb=Identify returns 500 — and the library page
      formerly cited as documenting it no longer mentions OAI-PMH. The relationship is kept; the
      unsupported endpoint claim is not. Pure person pages return 403 to non-browser clients.
    humanURL: https://research.utwente.nl/
    tags: [ Research Information, Pure, Elsevier, Repository, Publications, CRIS ]
    properties:
      - type: ResearchRepository
        url: https://research.utwente.nl/
