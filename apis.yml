aid: university-of-twente
name: University of Twente
x-type: university
x-category: Technical University
description: >-
  The University of Twente (Universiteit Twente, UT), founded in 1961 in Enschede, Netherlands, is
  a public technical research university. Its programmable footprint is small but, unusually for
  this cohort, not empty and not borrowed: the university operates one API of its own. The
  University of Twente Energy API at energyapi.utwente.nl publishes an OpenAPI 3.0.1 contract and
  a Swagger UI, requires no authentication, and serves historical electricity, gas, heat, water
  and solar metering for 103 named campus resources — with a CO2-equivalent mode computed against
  the Dutch national energy mix — from the university's own network. It backs the public Energy
  Data Platform at energydata.utwente.nl. Around that single owned contract, everything else is a
  relationship rather than an engineering artifact, and is recorded as such. The university runs
  its own SAML 2.0 identity provider on a Microsoft Entra ID tenant, registered in the SURFconext
  national federation with the Shibboleth scope utwente.nl — the strongest institution-operated
  surface it has after the Energy API. Its library is a Crossref member in its own name (prefix
  10.3990). It publishes a live Erasmus Without Paper node declaring fifteen student-mobility APIs
  scoped to HEI ID utwente.nl. Its research information system, learning management system,
  student information system and research-data repository are all tenancies on Elsevier Pure,
  Instructure Canvas, CACI OSIRIS and 4TU.ResearchData respectively — real institutional facts,
  none of them the university's contract. There is no central developer portal, no API catalog and
  no published terms for the one API that exists. A previously catalogued OAI-PMH endpoint on the
  Pure host was re-probed on 2026-09-01 and does not respond; that claim has been corrected rather
  than carried forward.
