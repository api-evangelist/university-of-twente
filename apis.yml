  - aid: university-of-twente:crossref-membership
    name: University of Twente Library Crossref Membership
    x-operator: registry
    description: >-
      The University Library registers DOIs with Crossref in the university's own name. Crossref
      member 2372, "University Library/University of Twente", located AE Enschede, Netherlands,
      holding DOI prefix 10.3990 with 599 member DOIs (23 current, 576 backfile) and 5,393 works
      resolvable under the prefix. This is an institution-operated identifier surface and a fact
      about the university, not a contract it publishes — the Crossref REST API belongs to
      Crossref. The university is also registered in ROR as https://ror.org/006hf6230 with domain
      utwente.nl and established date 1961. It is deliberately NOT recorded as a DataCite member:
      api.datacite.org returns zero clients and zero providers for the university, and its
      research-data DOIs are minted under prefix 10.4121 by 4TU.ResearchData, which TU Delft
      operates.
    humanURL: https://api.crossref.org/members/2372
    tags: [ DOI, Crossref, ROR, Identifiers, Registry, Scholarly Publishing ]
    properties:
      - type: Registry
        url: https://api.crossref.org/members/2372
      - type: ROR
