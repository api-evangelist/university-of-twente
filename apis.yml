  - aid: university-of-twente:llms-txt
    name: University of Twente llms.txt Programme Catalog
    x-operator: institution
    description: >-
      A machine-readable study-programme document the university serves from its own web root at
      www.utwente.nl/llms.txt, addressed explicitly at language models. It carries organisation
      identity, English and Dutch site URLs, and a programmes object covering bachelor, master and
      lifelong-learning offerings with degree, URL, duration, language of instruction, target
      group and mode per entry, plus a meta block with contact study@utwente.nl. Served as
      text/plain, 3,049 bytes, last modified 2026-07-21, with an internal last_updated of
      2025-10-20. Two defects are recorded rather than smoothed over: despite being JSON-shaped it
      is NOT valid JSON — it contains JavaScript block comments — and the bachelor and master
      arrays are elided to those comments rather than populated, so only the three
      lifelong-learning entries actually carry data. It is nonetheless a genuine institution-
      operated agent-facing surface, which very few universities in this cohort publish at all.
    humanURL: https://www.utwente.nl/llms.txt
    baseURL: https://www.utwente.nl/llms.txt
    tags: [ llms.txt, Agent Readiness, Course Catalog, Programmes, Machine Readable ]
    properties:
      - type: CourseCatalog
        url: https://www.utwente.nl/llms.txt
      - type: Website
        url: https://www.utwente.nl/en/education/
