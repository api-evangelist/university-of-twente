note: >-
  There is a documented/deployed mismatch here and it is recorded as observed, not as documented.
  The harvested OpenAPI declares the 400 response of both /api/Energy/{resource}/{type} and
  /api/Dashboard as components/schemas/ProblemDetails — the ASP.NET Core RFC 7807 shape with
  type/title/status/detail/instance. The service does not return that. Every observed error, at
  every status, returns the same bespoke success envelope with the message moved into `error` and
  `results` emptied. A client written against the published contract will look for `title` and
  `detail` and find neither. ProblemDetails is present in components but is not what ships.
envelope:
  content_type: application/json
  schema: json-schema/energy.json
  documented_schema: ProblemDetails
  documented_but_not_deployed: true
  example:
    error: 'Timestamp not provided in ISO8601 format: yyyy-MM-ddTHH:mm:ssZ'
    results:
      unit: null
      data: []
