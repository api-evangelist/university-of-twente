findings:
- id: problemdetails-declared-not-deployed
  severity: medium
  detail: >-
    Both operations declare application/json ProblemDetails on 400; the deployed 400 body is the
    {error, results} envelope. Either the spec should describe the real envelope or the service
    should emit ProblemDetails.
  evidence: 'GET /api/Energy/universiteit-twente/electricity?resolution=bogus&from=x&to=y -> 400, body {"error":"Timestamp not provided in ISO8601 format: yyyy-MM-ddTHH:mm:ssZ","results":{"unit":null,"data":[]}} (probed 2026-09-01)'
- id: dashboard-400-where-200-documented
  severity: medium
  detail: >-
    GET /api/Dashboard is documented to return 200 with savings and solar generation. On
    2026-09-01 it returned 400 with an internal-facing message naming the contracted developer's
    mailbox. No 200 example for this operation could be captured, so none was written.
  evidence: 'GET https://energyapi.utwente.nl/api/Dashboard -> 400 (probed 2026-09-01)'
- id: internal-error-message-leaks-vendor-mailbox
  severity: low
  detail: >-
    The Dashboard failure body returns a developer-facing joke string containing
    energyapi@realised.nl. Harmless, but it is an internal message reaching public callers.
